# ============================================================
# 员工考勤系统 docker-compose（一键启动前后台 + RabbitMQ）
# 数据库默认连接本机 Docker 中已运行的 MySQL 8.4 (端口 3456)
# 前端: http://localhost:8088   后端: http://localhost:8080
# RabbitMQ 管理台: http://localhost:15672 (admin/123456)
# 用法: docker compose up -d
# ============================================================
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pt-backend
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3456"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DB: pt
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: "123456"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pt-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped
