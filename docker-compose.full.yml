# ============================================================
# 完整版 docker-compose：mysql(8.4) + 后端 + 前端 全部容器化
# 适用于本机没有现成 MySQL 的场景（pt.sql 自动初始化数据）
# 前端: http://localhost:8088   后端: http://localhost:8080   MySQL: 3307
# 用法: docker compose -f docker-compose.full.yml up -d
# ============================================================
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: pt-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: pt
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pt-mysql-data:/var/lib/mysql
      - ./pt.sql:/docker-entrypoint-initdb.d/01-pt.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pt-backend
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123456"
      MYSQL_DB: pt
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: "123456"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pt-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pt-mysql-data:
